# 云端自动编译 APK（可选路线：电脑不想装 Android Studio 时用）
# 用法：把整个工程推送到 GitHub 仓库 -> Actions 页手动 Run workflow -> 下载 app-debug.apk
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成并保存固定签名密钥（仅首次，之后复用）
        run: |
          if [ ! -f keystore/debug.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/debug.jks -alias dsh \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dshdebug -keypass dshdebug \
              -dname "CN=DSH, OU=DSH, O=DSH, L=DSH, ST=DSH, C=CN" >/dev/null 2>&1
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git add keystore/debug.jks
            git commit -m "add fixed signing keystore" || true
            git push origin HEAD:main || true
          fi

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-timer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
