# 云端自动编译 APK（可选路线：电脑不想装 Android Studio 时用）
# 用法：把整个工程推送到 GitHub 仓库 -> Actions 页手动 Run workflow -> 下载 app-debug.apk
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-timer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
