plugins {
    id 'com.android.application'
}

android {
    namespace 'com.screenguard.timer'
    compileSdk 34

    defaultConfig {
        applicationId "com.screenguard.timer"
        minSdk 26          // Android 8.0 及以上
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // 固定签名：所有构建用同一个密钥，保证"覆盖安装"（权限/记录保留）
        release {
            storeFile file("../keystore/debug.jks")
            storePassword "dshdebug"
            keyAlias "dsh"
            keyPassword "dshdebug"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
